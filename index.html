<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مصاريف البيت</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="app-header">
    <h1>📒 مصاريف البيت</h1>
    <p class="subtitle">تابع مصاريف بيتك بسهولة</p>
  </header>

  <main class="container">
    <section class="card summary-card">
      <div class="summary-grid">
        <div class="summary-item">
          <span class="summary-label">إجمالي هذا الشهر</span>
          <span class="summary-value" id="monthTotal">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">إجمالي كل الوقت</span>
          <span class="summary-value" id="allTotal">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">عدد العمليات</span>
          <span class="summary-value" id="countTotal">0</span>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>إضافة مصروف جديد</h2>
      <form id="expenseForm" class="expense-form">
        <div class="form-row">
          <label for="amount">المبلغ</label>
          <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>
        </div>
        <div class="form-row">
          <label for="category">التصنيف</label>
          <select id="category" required>
            <option value="طعام">🍽️ طعام</option>
            <option value="مواصلات">🚗 مواصلات</option>
            <option value="فواتير">💡 فواتير</option>
            <option value="صحة">💊 صحة</option>
            <option value="تسوق">🛍️ تسوق</option>
            <option value="ترفيه">🎬 ترفيه</option>
            <option value="تعليم">📚 تعليم</option>
            <option value="أخرى">📦 أخرى</option>
          </select>
        </div>
        <div class="form-row">
          <label for="description">الوصف (اختياري)</label>
          <input type="text" id="description" placeholder="مثال: تسوق أسبوعي">
        </div>
        <div class="form-row">
          <label for="date">التاريخ</label>
          <input type="date" id="date" required>
        </div>
        <button type="submit" class="btn-primary">إضافة</button>
      </form>
    </section>

    <section class="card">
      <div class="section-header">
        <h2>التصنيفات (هذا الشهر)</h2>
      </div>
      <div id="categoryBreakdown" class="category-breakdown"></div>
    </section>

    <section class="card">
      <div class="section-header">
        <h2>سجل المصاريف</h2>
        <div class="filters">
          <input type="month" id="monthFilter">
          <select id="categoryFilter">
            <option value="">كل التصنيفات</option>
            <option value="طعام">🍽️ طعام</option>
            <option value="مواصلات">🚗 مواصلات</option>
            <option value="فواتير">💡 فواتير</option>
            <option value="صحة">💊 صحة</option>
            <option value="تسوق">🛍️ تسوق</option>
            <option value="ترفيه">🎬 ترفيه</option>
            <option value="تعليم">📚 تعليم</option>
            <option value="أخرى">📦 أخرى</option>
          </select>
        </div>
      </div>
      <ul id="expenseList" class="expense-list"></ul>
      <p id="emptyState" class="empty-state">لا توجد مصاريف مسجلة بعد.</p>
    </section>
  </main>

  <footer class="app-footer">
    <p>البيانات محفوظة على جهازك فقط.</p>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
